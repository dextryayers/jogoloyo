name: jogoloyo_les
description: "Les Jogoloyo V.01.0 local. Flutter plus Kotlin, 100 persen lokal tanpa database server."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  image: ^4.3.0
  share_plus: ^13.3.1
  timezone: ^0.9.4
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/strings/
    - assets/logo.png
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAF7F0"
  image: assets/logo.png
  android: true
  fullscreen: true
